name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize
          if ($results) {
            $msg = ($results | ForEach-Object { "$($_.Severity) $($_.RuleName) $($_.ScriptName):$($_.Line) $($_.Message)" }) -join '%0A'
            Write-Host "::error title=PSScriptAnalyzer::$msg"
            throw "PSScriptAnalyzer found $($results.Count) issue(s)."
          }

      - name: Pester
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -gt 0 -or $result.Result -ne 'Passed') {
            $msg = (@($result.Failed) | ForEach-Object { "$($_.ExpandedPath): $($_.ErrorRecord[0].Exception.Message)" }) -join '%0A'
            Write-Host "::error title=Pester::$msg"
            exit 1
          }

      - name: Generate demo report
        shell: pwsh
        run: ./scripts/Invoke-Reports.ps1 -DemoData -OutputPath ./reports

      - name: Upload demo report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: reports/
